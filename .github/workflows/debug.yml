name: Build Debug APK

on:
  push:
    branches: [ master ]
    paths-ignore: ['README.md', 'LICENSE', 'CHANGELOG.md', '.gitignore', 'changes.txt']

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ${{ github.workspace }}/release.keystore
      - name: Build debug APK
        run: ./gradlew assembleDebug
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk 'J~Net-AI-Assistant-debug.apk'
      - uses: actions/upload-artifact@v4
        with:
          name: JNet-AI-Assistant-Debug
          path: 'J~Net-AI-Assistant-debug.apk'